<div class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" class="active" data-bs-slide-to="0" aria-current="true"></button>
    <button type="button" data-bs-slide-to="1"></button>
    <button type="button" data-bs-slide-to="2"></button>
  </div>
  
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img class="d-block w-100 slide-1" src="" alt="First slide">
    </div>
    <div class="carousel-item">
      <img class="d-block w-100 slide-2" src="" alt="Second slide">
    </div>
    <div class="carousel-item">
      <img class="d-block w-100 slide-3" src="" alt="Third slide">
    </div>
  </div>
  
  <button class="carousel-control-prev" type="button" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
